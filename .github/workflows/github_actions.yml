name: Deploy to ECS (st / prod)

on:
  push:
    branches:
      - main
      - staging
  workflow_dispatch:

env:
  AWS_REGION: ap-northeast-1
  TASK_CPU: 512
  TASK_MEMORY: 2048

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==============================
      # 1️⃣ 環境設定
      # ==============================
      - name: Set environment (staging or prod)
        id: set-env
        run: |
          if [[ "${GITHUB_REF_NAME}" == "staging" ]]; then
            echo "ENV=stage" >> $GITHUB_ENV
            echo "AWS_ACCOUNT_ID=389759593235" >> $GITHUB_ENV
            echo "ECS_CLUSTER=stage-cluster" >> $GITHUB_ENV
            echo "ECS_SERVICE=stage-service" >> $GITHUB_ENV
          else
            echo "ENV=prod" >> $GITHUB_ENV
            echo "AWS_ACCOUNT_ID=550733172573" >> $GITHUB_ENV
            echo "ECS_CLUSTER=prod-cluster" >> $GITHUB_ENV
            echo "ECS_SERVICE=prod-service" >> $GITHUB_ENV
          fi

      # ==============================
      # 2️⃣ AWS 認証
      # ==============================
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ==============================
      # 3️⃣ Docker ビルド & Push to ECR
      # ==============================
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to ECR
        run: |
          IMAGE_TAG=$(date +%Y%m%d%H%M%S)
          ECR_REPO="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ENV}-ecr"
          docker build -t ${ECR_REPO}:${IMAGE_TAG} .
          docker push ${ECR_REPO}:${IMAGE_TAG}
          echo "IMAGE_URI=${ECR_REPO}:${IMAGE_TAG}" >> $GITHUB_ENV

      # ==============================
      # 4️⃣ タスク定義テンプレートの展開
      # ==============================
      - name: Generate task definition
        run: |
          envsubst < ecs-task-template.json > ecs-task.json
          echo "Task definition generated:"
          cat ecs-task.json

      # ==============================
      # 5️⃣ ECS タスク定義登録
      # ==============================
      - name: Register ECS task definition
        id: register-task
        run: |
          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://ecs-task.json \
            --query "taskDefinition.taskDefinitionArn" \
            --output text)
          echo "TASK_DEF_ARN=${TASK_DEF_ARN}" >> $GITHUB_ENV
          echo "Registered Task Definition: ${TASK_DEF_ARN}"

      # ==============================
      # 6️⃣ ECS サービス更新（デプロイ）
      # ==============================
      - name: Update ECS service
        run: |
          aws ecs update-service \
            --cluster ${ECS_CLUSTER} \
            --service ${ECS_SERVICE} \
            --task-definition ${TASK_DEF_ARN} \
            --force-new-deployment

      # ==============================
      # ✅ 結果確認
      # ==============================
      - name: Describe ECS service
        run: |
          aws ecs describe-services --cluster ${ECS_CLUSTER} --services ${ECS_SERVICE}
