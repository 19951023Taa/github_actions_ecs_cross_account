name: Deploy to ECS (st / prod, OIDC)

on:
  push:
    branches:
      - main      # 本番環境
      - staging   # ステージング環境
  workflow_dispatch:

env:
  AWS_REGION: ap-northeast-1

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write   # OIDC認証に必須
      contents: read

    steps:
      # 1) ソース取得
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2) 環境判定（staging/main で切替）
      - name: Set environment (staging or prod)
        id: set-env
        run: |
          if [[ "${GITHUB_REF_NAME}" == "staging" ]]; then
            echo "ENV=stage" >> $GITHUB_ENV
            echo "AWS_ACCOUNT_ID=${{ secrets.AWS_ACCOUNT_ID_STAGE }}" >> $GITHUB_ENV
            echo "ECS_CLUSTER=stage-cluster" >> $GITHUB_ENV
            echo "ECS_SERVICE=stage-service" >> $GITHUB_ENV
            echo "ROLE_ARN=arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID_STAGE }}:role/tastylog-dev-githubactions-role" >> $GITHUB_ENV
          else
            echo "ENV=prod" >> $GITHUB_ENV
            echo "AWS_ACCOUNT_ID=${{ secrets.AWS_ACCOUNT_ID_PROD }}" >> $GITHUB_ENV
            echo "ECS_CLUSTER=prod-cluster" >> $GITHUB_ENV
            echo "ECS_SERVICE=prod-service" >> $GITHUB_ENV
            echo "ROLE_ARN=arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID_PROD }}:role/tastylog-dev-githubactions-role" >> $GITHUB_ENV
          fi

      # 3) OIDCでAWS認証
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # 4) ECRログイン & コンテナビルド/プッシュ
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        run: |
          IMAGE_TAG=$(date +%Y%m%d%H%M%S)
          ECR_REPO="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ENV}-ecr"
          docker build -t ${ECR_REPO}:${IMAGE_TAG} .
          docker push ${ECR_REPO}:${IMAGE_TAG}
          echo "IMAGE_URI=${ECR_REPO}:${IMAGE_TAG}" >> $GITHUB_ENV

      # 5) envsubst を用意（テンプレ展開で使用）
      - name: Install envsubst
        run: sudo apt-get update && sudo apt-get install -y gettext-base

      # 6) タスク定義テンプレを展開（リポジトリ: task/task-definition.json）
      - name: Render ECS task definition
        run: |
          envsubst < task/task-definition.json > task/ecs-task.json
          echo "Task definition rendered:"
          cat task/ecs-task.json

      # 7) タスク定義を登録
      - name: Register ECS task definition
        id: register-task
        run: |
          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://task/ecs-task.json \
            --query "taskDefinition.taskDefinitionArn" \
            --output text)
          echo "TASK_DEF_ARN=${TASK_DEF_ARN}" >> $GITHUB_ENV
          echo "✅ Registered Task Definition: ${TASK_DEF_ARN}"

      # 8) サービス更新（強制デプロイ）
      - name: Update ECS service
        run: |
          aws ecs update-service \
            --cluster ${ECS_CLUSTER} \
            --service ${ECS_SERVICE} \
            --task-definition ${TASK_DEF_ARN} \
            --force-new-deployment
          echo "🚀 ECS service update triggered."

      # 9) 安定化待ち（任意だが推奨）
      - name: Wait for service stability
        run: |
          echo "⏳ Waiting for service to stabilize..."
          aws ecs wait services-stable --cluster ${ECS_CLUSTER} --services ${ECS_SERVICE}
          aws ecs describe-services --cluster ${ECS_CLUSTER} --services ${ECS_SERVICE}
          echo "✅ Deployment successful!"
